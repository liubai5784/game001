<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>星域祈愿 · 双池抽卡 | 原神 & 王者荣耀水晶</title>
  <style>
    :root {
      --bg-deep: #0a0a14;
      --bg-card: #1a1a2e;
      --bg-panel: #141428;
      --gold: #f0c060;
      --gold-dark: #b8943a;
      --gold-light: #ffe9b0;
      --purple: #b880e0;
      --purple-dark: #6a3d99;
      --purple-light: #d4b8f0;
      --blue: #5b9bd5;
      --blue-dark: #3a6d99;
      --blue-light: #a8d0f0;
      --text: #e0d8c8;
      --text-dim: #9a9488;
      --star-5: #f7c948;
      --star-4: #c882f0;
      --star-3: #6ba8d8;
      --accent: #ff6b6b;
      --primogem: #5ec5e8;
      
      /* 王者水晶配色 */
      --crystal-pink: #ff80b0;
      --crystal-deep: #b0306a;
      --crystal-light: #ffc0d0;
      --diamond-blue: #40c8f0;
      --diamond-dark: #1a6090;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(180, 140, 60, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse at 20% 80%, rgba(120, 80, 180, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(60, 120, 200, 0.05) 0%, transparent 60%);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 星空背景 */
    .stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star-particle {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.8); }
    }

    /* 游戏切换导航 */
    .game-switcher {
      position: relative;
      z-index: 20;
      display: flex;
      gap: 8px;
      background: rgba(20, 20, 40, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 12px;
      border-radius: 40px;
      margin: 16px auto 8px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: fit-content;
      flex-wrap: wrap;
      justify-content: center;
    }
    .switch-btn {
      padding: 10px 22px;
      border-radius: 30px;
      border: none;
      background: transparent;
      color: #aaa;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 1px;
      font-family: inherit;
      white-space: nowrap;
    }
    .switch-btn.active {
      background: rgba(255,255,255,0.1);
      color: white;
      box-shadow: 0 0 16px rgba(255,255,200,0.15);
    }
    .switch-btn.genesis {
      color: #f0c060;
    }
    .switch-btn.genesis.active {
      background: rgba(240,192,96,0.2);
      border: 1px solid rgba(240,192,96,0.45);
    }
    .switch-btn.honor {
      color: #ff80b0;
    }
    .switch-btn.honor.active {
      background: rgba(255,128,176,0.2);
      border: 1px solid rgba(255,128,176,0.5);
    }

    /* 主面板容器 */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 16px 24px;
    }

    /* 两个游戏面板切换显示 */
    .game-panel {
      display: none;
    }
    .game-panel.active {
      display: block;
    }

    /* 通用卡片样式 */
    .top-bar, .up-showcase, .pity-progress, .history-section, .crystal-stats {
      background: var(--bg-panel);
      border-radius: 18px;
      padding: 14px 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .currency-display {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #fff;
      background: rgba(94,197,232,0.12);
      padding: 7px 18px;
      border-radius: 24px;
    }
    .btn-sm {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #ccc;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-sm:hover {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .banner-area {
      text-align: center;
      margin-bottom: 16px;
    }
    .banner-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #ffe9b0 0%, #d4a040 50%, #8a6020 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .banner-subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 3px;
    }

    .wish-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    .btn-wish {
      padding: 14px 32px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: linear-gradient(135deg, #4a4a6a, #3a3a55);
      color: white;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      font-family: inherit;
    }
    .btn-wish:active { transform: scale(0.96); }
    .btn-wish:disabled { opacity: 0.4; pointer-events: none; }

    /* 历史记录 */
    .history-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .history-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* 王者荣耀水晶专属 */
    .crystal-main {
      background: radial-gradient(circle at 30% 30%, #2a1a30, #120a1a);
      border: 1px solid rgba(255,128,176,0.35);
    }
    .crystal-amount {
      background: rgba(255,128,176,0.15);
      border: 1px solid #ff80b0;
    }
    .diamond-icon {
      background: linear-gradient(135deg, #40c8f0, #1a6090);
      border-radius: 6px;
      transform: rotate(45deg);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px #40c8f0;
    }
    .diamond-icon::after {
      content: '💎';
      transform: rotate(-45deg);
      font-size: 14px;
    }
    .crystal-progress-box {
      background: #1e1428;
      border-radius: 20px;
      padding: 12px 16px;
    }
    .lucky-bar {
      height: 10px;
      background: #2a1a35;
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0;
    }
    .lucky-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff80b0, #ff4080);
      box-shadow: 0 0 14px #ff4080;
      transition: width 0.2s ease;
    }
    .crystal-result-icon {
      font-size: 2.8rem;
      filter: drop-shadow(0 0 14px #ff80b0);
    }

    /* 弹窗等复用 */
    .modal-overlay {
      position: fixed;
      top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: 22px;
      padding: 20px;
      max-width: 500px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.15);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #222; color: white; padding: 12px 24px; border-radius: 24px;
      z-index: 300; animation: toastIn 0.3s;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @media (max-width: 500px) {
      .switch-btn { padding: 8px 14px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="stars-container" id="starsContainer"></div>

  <!-- 游戏切换器 -->
  <div class="game-switcher">
    <button class="switch-btn genesis active" id="switchGenshin">✨ 原神 · 祈愿</button>
    <button class="switch-btn honor" id="switchHonor">👑 王者 · 荣耀水晶</button>
  </div>

  <div class="app-container" id="appContainer">
    <!-- ========= 原神面板 ========= -->
    <div class="game-panel active" id="panelGenshin">
      <div class="top-bar">
        <div class="currency-display"><div class="primogem-icon"></div><span id="primogemCount">9600</span></div>
        <button class="btn-sm" onclick="addGenshinCurrency(160)">+160</button>
        <button class="btn-sm" onclick="addGenshinCurrency(1600)">+1600</button>
        <div><span>五星保底:</span> <strong id="pity5Display">0</strong>/90</div>
      </div>
      <div class="banner-area"><div class="banner-title">星域祈愿</div><div class="banner-subtitle">GENSHIN WISH</div></div>
      <div class="up-showcase" style="display:flex; align-items:center; gap:16px;">
        <div style="font-size:3rem;">✨🌟</div>
        <div><h3>荧辉·星落</h3><div style="color:#f0c060;">★★★★★ UP</div></div>
      </div>
      <div class="pity-progress">
        <div>五星进度 <span id="pity5Text">0</span>/90</div>
        <div class="lucky-bar"><div class="lucky-fill" id="pity5Bar" style="background:linear-gradient(90deg,#f0c060,#ffaa00);"></div></div>
      </div>
      <div class="wish-buttons">
        <button class="btn-wish" onclick="performGenshinWish(1)">祈愿×1 (160)</button>
        <button class="btn-wish" style="background:linear-gradient(135deg,#6a4a8a,#4a3070);" onclick="performGenshinWish(10)">祈愿×10 (1600)</button>
      </div>
      <div class="history-section"><h4>📜 原神记录</h4><div class="history-list" id="genshinHistory">暂无记录</div></div>
    </div>

    <!-- ========= 王者荣耀水晶面板 ========= -->
    <div class="game-panel" id="panelHonor">
      <div class="top-bar crystal-main">
        <div class="currency-display crystal-amount"><span>💎</span> <span id="diamondCount">5000</span></div>
        <button class="btn-sm" onclick="addHonorCurrency(270)">+270</button>
        <button class="btn-sm" onclick="addHonorCurrency(1350)">+1350</button>
        <div><span>幸运值:</span> <strong id="luckyValueDisplay">0</strong>/361</div>
      </div>
      <div class="banner-area">
        <div class="banner-title" style="background: linear-gradient(180deg, #ffc0d0, #ff80b0, #b0306a); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">荣耀水晶</div>
        <div class="banner-subtitle">HONOR CRYSTAL</div>
      </div>
      <div class="crystal-progress-box">
        <div style="display: flex; justify-content: space-between;">
          <span>🔮 幸运值</span><span id="luckyText">0 / 361</span>
        </div>
        <div class="lucky-bar"><div class="lucky-fill" id="luckyBarFill" style="background:#ff4080;"></div></div>
        <div style="font-size:0.7rem; color:#aaa;">保底361必出荣耀水晶</div>
      </div>
      <div class="wish-buttons">
        <button class="btn-wish" style="background:#b0306a;" onclick="performHonorDraw(1)">抽1次 (60💎)</button>
        <button class="btn-wish" style="background:linear-gradient(135deg,#c04080,#802050);" onclick="performHonorDraw(5)">抽5次 (270💎)</button>
      </div>
      <div class="history-section"><h4>👑 水晶记录</h4><div class="history-list" id="honorHistory">暂无抽奖</div></div>
    </div>
  </div>

  <div id="modalContainer"></div>
  <div id="fxContainer"></div>

  <script>
    (function() {
      // ---------- 星空背景 ----------
      function createStars() {
        const container = document.getElementById('starsContainer');
        for (let i=0;i<70;i++) {
          const star = document.createElement('div');
          star.className = 'star-particle';
          star.style.left = Math.random()*100+'%';
          star.style.top = Math.random()*100+'%';
          star.style.width = (1+Math.random()*2.5)+'px';
          star.style.height = star.style.width;
          star.style.setProperty('--dur', (2+Math.random()*6)+'s');
          star.style.setProperty('--delay', Math.random()*5+'s');
          container.appendChild(star);
        }
      }
      createStars();

      // ---------- 全局切换逻辑 ----------
      const switchGenshin = document.getElementById('switchGenshin');
      const switchHonor = document.getElementById('switchHonor');
      const panelGenshin = document.getElementById('panelGenshin');
      const panelHonor = document.getElementById('panelHonor');

      function setActivePanel(panelName) {
        if (panelName === 'genshin') {
          panelGenshin.classList.add('active');
          panelHonor.classList.remove('active');
          switchGenshin.classList.add('active');
          switchHonor.classList.remove('active');
        } else {
          panelHonor.classList.add('active');
          panelGenshin.classList.remove('active');
          switchHonor.classList.add('active');
          switchGenshin.classList.remove('active');
        }
      }
      switchGenshin.addEventListener('click', ()=> setActivePanel('genshin'));
      switchHonor.addEventListener('click', ()=> setActivePanel('honor'));

      // ---------- 原神抽卡状态 ----------
      const genshinState = {
        primogems: 9600,
        pity5: 0,
        pity4: 0,
        guaranteed: false,
        totalWishes: 0,
        history: []
      };
      const fiveStars = [
        { name:'荧辉·星落', icon:'✨🌟', up:true },
        { name:'墨渊·暗影', icon:'🌑💜', up:false },
        { name:'风翎·青岚', icon:'🍃💨', up:false },
        { name:'霜落·雪月', icon:'❄️🌙', up:false }
      ];
      const fourStars = [
        { name:'苍林·翠微', icon:'🌿' }, { name:'流云·白羽', icon:'☁️' }
      ];
      const threeStars = [
        { name:'铁剑', icon:'🗡️' }, { name:'猎弓', icon:'🏹' }
      ];

      function updateGenshinUI() {
        document.getElementById('primogemCount').textContent = genshinState.primogems;
        document.getElementById('pity5Display').textContent = genshinState.pity5;
        document.getElementById('pity5Text').textContent = genshinState.pity5;
        const bar = document.getElementById('pity5Bar');
        bar.style.width = Math.min(100, (genshinState.pity5/90)*100)+'%';
        
        const historyDiv = document.getElementById('genshinHistory');
        if (genshinState.history.length===0) historyDiv.innerHTML = '暂无记录';
        else historyDiv.innerHTML = genshinState.history.slice(0,20).map(h=> 
          `<div class="history-item">${h.icon} ${h.name} (${'★'.repeat(h.rarity)})</div>`).join('');
      }

      function genshinSinglePull() {
        let rarity;
        const p5 = genshinState.pity5>=89 ? 1.0 : (genshinState.pity5>=73 ? 0.006+(genshinState.pity5-72)*0.06 : 0.006);
        if (Math.random() < p5) rarity=5;
        else if (Math.random() < 0.051 || genshinState.pity4>=9) rarity=4;
        else rarity=3;

        let item;
        if (rarity===5) {
          const up = genshinState.guaranteed ? true : Math.random()<0.5;
          genshinState.guaranteed = !up;
          item = up ? {...fiveStars.find(f=>f.up)} : {...fiveStars.filter(f=>!f.up)[Math.floor(Math.random()*4)]};
          genshinState.pity5=0; genshinState.pity4=0;
        } else if (rarity===4) {
          item = {...fourStars[Math.floor(Math.random()*fourStars.length)], rarity:4};
          genshinState.pity5++; genshinState.pity4=0;
        } else {
          item = {...threeStars[Math.floor(Math.random()*threeStars.length)], rarity:3};
          genshinState.pity5++; genshinState.pity4++;
        }
        genshinState.history.unshift({...item});
        if(genshinState.history.length>30) genshinState.history.pop();
        return item;
      }

      window.performGenshinWish = function(count) {
        const cost = count*160;
        if(genshinState.primogems < cost) return showToast('原石不足');
        genshinState.primogems -= cost;
        const results = [];
        for(let i=0;i<count;i++) results.push(genshinSinglePull());
        updateGenshinUI();
        if(results.some(r=>r.rarity===5)) spawnGoldenBeam();
        showResultModal(results, 'genshin');
      };

      window.addGenshinCurrency = (amt)=>{ genshinState.primogems+=amt; updateGenshinUI(); };

      // ---------- 王者荣耀水晶状态 ----------
      const honorState = {
        diamonds: 5000,
        lucky: 0,
        history: []
      };
      function updateHonorUI() {
        document.getElementById('diamondCount').textContent = honorState.diamonds;
        document.getElementById('luckyValueDisplay').textContent = honorState.lucky;
        document.getElementById('luckyText').textContent = honorState.lucky + ' / 361';
        document.getElementById('luckyBarFill').style.width = (honorState.lucky/361*100)+'%';
        
        const histDiv = document.getElementById('honorHistory');
        if(honorState.history.length===0) histDiv.innerHTML = '暂无抽奖';
        else histDiv.innerHTML = honorState.history.slice(0,20).map(h=> 
          `<div class="history-item">🔮 ${h.result} (幸运${h.lucky})</div>`).join('');
      }

      function honorSingleDraw() {
        honorState.lucky++;
        let isCrystal = false;
        if (honorState.lucky >= 361) {
          isCrystal = true;
        } else {
          // 平均概率约0.8%，随幸运值微增
          const prob = 0.008 + (honorState.lucky * 0.00008);
          isCrystal = Math.random() < prob;
        }
        
        let resultText = '普通物品';
        if (isCrystal) {
          resultText = '👑 荣耀水晶';
          honorState.lucky = 0; // 重置幸运值
          spawnCrystalEffect();
        } else {
          const items = ['皮肤碎片','英雄碎片','钻石×28','铭文碎片','战令币'];
          resultText = items[Math.floor(Math.random()*items.length)];
        }
        honorState.history.unshift({ result: resultText, lucky: honorState.lucky });
        if(honorState.history.length>30) honorState.history.pop();
        return { crystal: isCrystal, text: resultText };
      }

      window.performHonorDraw = function(count) {
        const cost = count===5 ? 270 : 60;
        if(honorState.diamonds < cost) return showToast('钻石不足');
        honorState.diamonds -= cost;
        const draws = [];
        for(let i=0;i<count;i++) draws.push(honorSingleDraw());
        updateHonorUI();
        const gotCrystal = draws.some(d=>d.crystal);
        if(gotCrystal) {
          showToast('🎉 获得荣耀水晶！');
        }
        showHonorResultModal(draws);
      };

      window.addHonorCurrency = (amt)=>{ honorState.diamonds+=amt; updateHonorUI(); };

      // ---------- 特效与弹窗 ----------
      function spawnGoldenBeam() {
        const fx = document.getElementById('fxContainer');
        const beam = document.createElement('div');
        beam.style.position='fixed'; beam.style.top=0; beam.style.left='50%';
        beam.style.width='120px'; beam.style.height='100%'; beam.style.background='rgba(255,215,0,0.3)';
        beam.style.transform='translateX(-50%)'; beam.style.zIndex=250;
        fx.appendChild(beam);
        setTimeout(()=>beam.remove(), 700);
      }
      function spawnCrystalEffect() {
        const fx = document.getElementById('fxContainer');
        const el = document.createElement('div');
        el.style.position='fixed'; el.style.top='40%'; el.style.left='50%';
        el.innerHTML='💖👑✨'; el.style.fontSize='4rem'; el.style.transform='translate(-50%,-50%)';
        el.style.zIndex=260; fx.appendChild(el);
        setTimeout(()=>el.remove(), 900);
      }

      function showResultModal(results, game) {
        const modal = document.createElement('div');
        modal.className='modal-overlay';
        let html = '';
        if(game==='genshin'){
          results.forEach(r=>{
            html += `<div style="display:flex; gap:12px; align-items:center; margin:8px 0;">${r.icon} ${r.name} (${'★'.repeat(r.rarity||5)})</div>`;
          });
        }
        modal.innerHTML = `<div class="modal-content"><h3>祈愿结果</h3>${html}<button class="btn-sm" style="margin-top:12px;">关闭</button></div>`;
        document.body.appendChild(modal);
        modal.querySelector('button').onclick = ()=> modal.remove();
        modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.remove(); });
      }

      function showHonorResultModal(draws) {
        const modal = document.createElement('div');
        modal.className='modal-overlay';
        let items = draws.map(d=>`<div>🔮 ${d.text}</div>`).join('');
        modal.innerHTML = `<div class="modal-content"><h3>抽奖结果</h3>${items}<button class="btn-sm" style="margin-top:12px;">确定</button></div>`;
        document.body.appendChild(modal);
        modal.querySelector('button').onclick = ()=> modal.remove();
        modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.remove(); });
      }

      function showToast(msg) {
        const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
        document.body.appendChild(t);
        setTimeout(()=>t.remove(), 2000);
      }

      // 初始化UI
      updateGenshinUI();
      updateHonorUI();
      // 默认显示原神面板
      setActivePanel('genshin');

      // 键盘快捷键 1/0 仅对当前活动面板有效
      document.addEventListener('keydown', (e)=>{
        if(e.target.tagName==='INPUT') return;
        if(panelGenshin.classList.contains('active')){
          if(e.key==='1') performGenshinWish(1);
          else if(e.key==='0') performGenshinWish(10);
        } else if(panelHonor.classList.contains('active')){
          if(e.key==='1') performHonorDraw(1);
          else if(e.key==='5') performHonorDraw(5);
        }
      });

    })();
  </script>
</body>
</html>
